  email: ''
  bio: Lena is a Psychology PhD student. She earned her B.S. in Neuroscience and Psychology from the University of Nevada, Reno, where she worked with Drs. Marian Berryhill and Sarah Haigh, studying sensory sensitivity and working memory in concussion and schizotypy using behavioral and EEG methods. At UCSD, she is excited to apply computational approaches to investigate visual attention and working memory. Outside the lab, Lena enjoys thrifting, playing the clarinet, traveling, and listening to podcasts.
  image: "/assets/images/people/lena-kemmelmeier.jpg"
