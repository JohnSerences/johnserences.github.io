---
- name: Luis D Ramirez
  position: Postdoc
  email: ''
  bio: Luis is investigating the influence of sensory history on texture encoding and perception, employing a combination of psychophysics, fMRI, and computational approaches. He earned a BS in Science and Technology Studies while working with Drs. Rachel Denison and Marisa Carrasco on temporal attention research, Dr. Jonathan Bain on philosophy of physics research, and briefly with Dr. Frank Tong at Vanderbilt University on face perception and memory research. He earned his PhD from the Graduate Program for Neuroscience at Boston University with Dr. Sam Ling, where he investigated how attention and emotion influence the processing of fundamental visual features like spatial frequency, measured via fMRI-based models of population-level tuning. His postdoctoral work is supported by the NIH Blueprint D-SPAN K00 Award.
  image: "/assets/images/people/luis-d-ramirez.jpg"
- name: Holly Kular
  position: Grad Student
  email: ''
  bio: Holly is a Ph.D. student in the Psychology Department. She earned her B.S. in Neuroscience at UCLA, where she worked in a concussion research lab led by Dr. Chris Giza. Next, she worked as a lab manager at the Stanford Vision and Perception Neuroscience Lab led by Dr. Kalanit Grill-Spector measuring how the brain and visual perception change across development. At UCSD, Holly is excited to continue exploring the visual system and its neural mechanisms, especially attention and perception. Outside of the lab, she enjoys all things outdoors including running, skiing, and nature photography.
  image: "/assets/images/people/holly-kular.jpg"
- name: Leah Ettensohn
  position: Grad Student
  email: ''
  bio: Leah is a PhD candidate in the Psychology Department. She earned her B.S. in Cognitive Psychology from Carnegie Mellon University. Leah completed her undergraduate honors thesis in the lab of Dr. Marlene Behrmann, where she studied plasticity in the visual system. She then received a post-bac IRTA fellowship to study visuomotor perception at the NIH under Drs. Leslie Ungerleider and Chris Baker. At UCSD, Leah is currently studying multimodal working memory and attention. Leah enjoys pilates, being outdoors, and spending time with her cat.
  image: "/assets/images/people/leah-ettensohn.jpg"
- name: Yixin Yuan
  position: Grad Student
  email: ''
  bio: Yixin / Stella is a third-year Neuroscience PhD student in the Serences and Aoi labs. She received a B.S. in Neuroscience at Carnegie Mellon University, where she completed an honors thesis on cell-type specific epigenetic markers of aging under the direction of Dr. Andreas Pfenning. She then received training at the Marcus Autism Center with Dr. Ami Klin, Dr. Warren Jones and Dr. Hasse Walum to parse heterogeneity within Autism Spectrum Disorder from longitudinal clinical assessments and eye-tracking data. At UCSD, Stella is interested in investigating how neural representations of visual experiences evolve over time, and how the brain can maintain stable interpretations of the world given these changes in neural activity.
  image: "/assets/images/people/yixin-yuan.jpg"
- name: Isabella Longoria-Valenzuela
  position: Grad Student
  email: ''
  bio: Isabella is a first-year Psychology PhD student in the Brady and Serences labs. She earned her B.A. in Cognitive Neuroscience at Brown University, where she conducted computational visual perception research with Dr. Thomas Serre. She is interested in leveraging computational tools to investigate the intersection between visual perception, working memory, and long-term visual memory. When she is not in lab, Isabella enjoys eating french fries, doing yoga, and listening to podcasts.
  image: "/assets/images/people/isabella-longoria-valenzuela.jpg"
- name: Lena Kemmelmeier
