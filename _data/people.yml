  bio: Chattarin (Pun) is a PhD student in the Brady and Serences labs. He recently completed his M.D. from Chulalongkorn University, Thailand. During medical school years, he liked to sneak out and study biases in working memory with Dr. Chaipat Chunharas. He is interested in studying how humans use memory to imagine, think and plan by using a combination of psychophysical experiments, neuroimaging techniques and computational modeling. When he is not in the lab, you can find him walking on the street and taking some weird random photos.
